[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-raft"
version = "0.3.0dev"
description = "Experiment-first research catalog for scientists"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Pietro Berkes" }]
dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyarrow>=14.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff==0.16.5",
]

[project.scripts]
raft = "raft.__main__:main"

[tool.setuptools.packages.find]
include = ["raft*"]

# Ensure skills (.md files) are packaged with the wheel so pip-installed
# users can copy them into ~/.claude/skills/ via `raft install-skills`.
[tool.setuptools.package-data]
"raft.skills" = ["*.md"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
